# The invite link shortener (see README.md). Deploy with `npm run shortener:deploy`.
name = "kakeya-go"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "go.kakeya.kim", custom_domain = true }]

[vars]
SITE = "https://www.kakeya.kim"
# Who may make short links: the live site, the Cloudflare Pages project and its previews, the dev server.
ORIGINS = "https://www.kakeya.kim https://kimsite.pages.dev https://*.kimsite.pages.dev http://localhost:4321"

# Created once with `npx wrangler kv namespace create LINKS`, which prints the id to paste here.
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
